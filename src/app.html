<!doctype html>
<html lang="en-GB" class="theme-petrol">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#1c7e84" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800;9..144,900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				try {
					var favKey = 'ccl-favourite';
					var schemeKey = 'ccl-scheme';
					var cookieFav = document.cookie.match(/(?:^|; )ccl_favourite=([^;]*)/);
					var cookieScheme = document.cookie.match(/(?:^|; )ccl_scheme=([^;]*)/);
					var fav = localStorage.getItem(favKey) || (cookieFav && decodeURIComponent(cookieFav[1]));
					var scheme =
						localStorage.getItem(schemeKey) ||
						(cookieScheme && decodeURIComponent(cookieScheme[1]));
					var root = document.documentElement;
					root.classList.add('theme-petrol');
					if (fav) root.setAttribute('data-county', fav);
					if (scheme === 'dark') root.setAttribute('data-scheme', 'dark');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
